      - title: Nanamusic音乐App
        link: "https://nana-music.com/"
        role: "服務端工程師"
        description: Nanamusic是一款在日本音樂愛好者社群中廣受歡迎的創作型App.作為服務端核心開發成員,負責系統架構設計與運維管理工作,採用敏捷開發模式確保項目快速更新迭代.
