      description: | 
      

    - role: 服務端工程師
      time: 2019.09 - 2022.10
      company: OST株式會社(東證代碼:2427), 東京 
      details: |
        以服務端工程師的身份參與日本政府戶籍電子化和豐田集團智能都市TRI-AD(現Woven planet)的開發項目.
        - **日本政府戶籍電子化項目**:參與由富士菲林主導的日本政府戶籍電子化項目,開發了5款windows應用程序輔助戶籍科解決戶籍系統電子化中的問題.
          通過導入OCR文字識別技術,將掃描圖像格式的戶籍檔案藤本轉換成結構化數據,使處理效率從原本需要10年人工操作提升至數小時即可完成.項目的生產環境涉及日本國民的戶籍數據,嚴格遵循日本個人信息保護法,確保國民敏感數據的安全合規.
        - **智能物流配送系統**:負責豐田集團智能都市(Woven City)的智能物流配送系統服務端開發,採用微服務架構設計與實現支持3000餘台配送機器人協同作業的核心系統.
