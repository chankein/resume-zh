      為應對這一問題,我有意識地選擇不同角色和位置,以加強自身知識廣度,減少技術盲點.此外,作為團隊的一員,我可以通過自身的開發經驗彌補團隊的技術缺口,確保項目順利推進.
      <br/>
      *點擊項目標題可打開項目相關的網頁.
   
    project:
      - title: LY集團數據倉庫遷移
        link: "https://www.lycorp.co.jp/ja/company/"
        role: "技術組長兼項目經理"
        description: |
                    Line Yahoo(LY集團)作為日本最大互聯網企業,旗下擁有覆蓋71%人口的Line通訊軟件、市佔率66%的PayPay支付等核心業務.為應對數據量持續增長及降低運維成本,主導將集團本地Teradata數據中心遷移至AWS Redshift雲端平台的戰略計劃.
        KeyAchievements: |
                    1. 集團內資源協調:統籌集團跨事業部資源協調,完成業務板塊數據架構調研與遷移排期規劃
                    1. 技術調研:系統分析Teradata與Redshift的數據庫技術差異,制定分階段遷移策略.
                    1. 資源評估:評估遷移所需的硬件,人力和時間成本,為資源調配提供依據.
                    1. 標準化流程:通過試點遷移,逐步建立和完善標準化操作方案(SOP).
                    1. 數據一致性保障:定義數據校驗標準,開發並持續優化自動化校驗框架和腳本.
                    1. 問題監控:實時監控遷移進度,協調解決技術團隊執行過程中出現的各類問題.

      - title: 日本人流統計系統
        link: "https://www.softbank.jp/biz/services/analytics/ugoki/"
        role: "大數據工程師(技術組長)"
        description: 日本人流統計系統是日本三大電信營運商之一的Softbank實施的項目.通過運用Softbank的移動電話基站數據,結合終端設備的位置信息,生成了人流數據.這些數據不僅包括人民在何時何地的分佈情況,還涵蓋了他們的移動路徑和交通方式,從而可以用於分析和預測全國的1.2億人口的人流動態.
        KeyAchievements: |
                    1. 負責對從本地數據倉庫遷移到雲平台上的選型,最終選定Databricks平台作為遷移目標,通過對技術驗證,保障現有系統和腳本順利遷移.
                    1. 負責對異常數據的檢測跟蹤,提供數據在地圖上的可視化工具幫助定位分析數據異常.
