      company: Amigo技術咨詢工作室, 東京 
      details: |
        - LY集團數據倉庫遷移:作為技術組長兼項目經理,主導日本Line Yahoo集團企業級數據平台遷移:包括完成從Teradata本地數據中心到AWS Redshift的完整技術方案驗證;負責遷移資源評估與項目進度管控,確保按時交付;開發標準化遷移流程與數據校驗機制,保障數據一致性;協調集團內部事業部的技術對接與資源調配.項目完成後,參考同規模企業從Teradata遷移到AWS Redshift的案例,預計可降低35%-45%的數據平台總運營成本,包括許可、硬件和維護費用.
