        - 日本旅遊行程自動生成APP(個人開發項目):App根據用戶輸入的起點終點,移動方法和旅遊目的地信息,自動規劃行程方案.項目涵蓋:需求分析與系統架構規劃,UI設計,APP開發,服務端開發,管理後台網頁開發,爬蟲數據收集等技術應用.
